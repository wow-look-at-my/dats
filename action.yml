name: Run dats
description: Download the dats binary from buildhost and run it, without a caller having to hand-roll the download

inputs:
  args:
    description: 'Arguments to pass to dats (e.g. "test tests/", "--no-sandbox test tests/")'
    required: true
  working-directory:
    description: 'Directory to run dats from'
    required: false
    default: '.'
  version:
    description: 'dats release version to download (e.g. v3); omit for the newest on the default branch'
    required: false
    default: ''

outputs:
  path:
    description: 'Full path to the downloaded dats binary'
    value: ${{ steps.download.outputs.path }}

runs:
  using: composite
  steps:
    # os/arch default to the runner's own platform -- docs/action.md.
    - name: Download dats
      id: download
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: dats
        version: ${{ inputs.version }}

    # A caller must never need --no-sandbox to work around us -- docs/action.md.
    - name: Install the sandbox backend
      shell: bash
      env:
        # An NT runner hands out a backslash path, and bash eats each backslash as an escape -- docs/action.md.
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${ACTION_PATH//\\//}/.github/scripts/install-sandbox-backend.sh"

    # Clears what a step can clear, and deliberately does NOT judge the result -- docs/action.md.
    - name: Allow an unprivileged user namespace where the kernel gates one (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${ACTION_PATH//\\//}/.github/scripts/allow-unprivileged-userns.sh"

    - name: Run dats
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Same backslash rule as above: this one is the downloaded binary's own path.
        DATS_BIN: ${{ steps.download.outputs.path }}
      run: |
        "${DATS_BIN//\\//}" ${{ inputs.args }}
