name: Run dats
description: Download the dats binary from buildhost and run it, without a caller having to hand-roll the download

inputs:
  args:
    description: 'Arguments to pass to dats (e.g. "test tests/", "--no-sandbox test tests/")'
    required: true
  working-directory:
    description: 'Directory to run dats from'
    required: false
    default: '.'
  version:
    description: 'dats release version to download (e.g. v3); omit for the newest on the default branch'
    required: false
    default: ''

outputs:
  path:
    description: 'Full path to the downloaded dats binary'
    value: ${{ steps.download.outputs.path }}

runs:
  using: composite
  steps:
    # os/arch default to the runner's own platform (buildhost-download reads
    # RUNNER_OS/RUNNER_ARCH when neither is given).
    - name: Download dats
      id: download
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: dats
        version: ${{ inputs.version }}

    # dats sandboxes test commands by default (bubblewrap on Linux, seatbelt on
    # macOS, docker otherwise) -- real isolation, not a formality, so a caller
    # should never have to reach for --no-sandbox just to work around
    # infrastructure. Ubuntu 24.04 ships a default AppArmor restriction
    # (kernel.apparmor_restrict_unprivileged_userns=1) that silently denies
    # bwrap's unprivileged user namespace; this repo's own CI (.github/workflows/ci.yml)
    # already proved sudo can clear it. Skips on non-Linux (macOS's seatbelt
    # sandbox needs no such fix); the final bwrap check has no fallback --
    # a runner where this genuinely doesn't work should fail loudly here,
    # not silently ship unsandboxed test runs.
    - name: Enable bubblewrap sandboxing (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        command -v bwrap >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y bubblewrap)
        # The sysctl write can itself fail harmlessly (e.g. a kernel with no
        # such knob) -- `|| true` keeps this a probe, not an abort, so the
        # bwrap re-check below stays the one authoritative pass/fail signal.
        bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-pid --die-with-parent true \
          || sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-pid --die-with-parent true

    - name: Run dats
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        "${{ steps.download.outputs.path }}" ${{ inputs.args }}
