name: Run dats
description: Download the dats binary from buildhost and run it, without a caller having to hand-roll the download

inputs:
  args:
    description: 'Arguments to pass to dats (e.g. "test tests/", "--no-sandbox test tests/")'
    required: true
  working-directory:
    description: 'Directory to run dats from'
    required: false
    default: '.'
  version:
    description: 'dats release version to download (e.g. v3); omit for the newest on the default branch'
    required: false
    default: ''

outputs:
  path:
    description: 'Full path to the downloaded dats binary'
    value: ${{ steps.download.outputs.path }}

runs:
  using: composite
  steps:
    # os/arch default to the runner's own platform (buildhost-download reads
    # RUNNER_OS/RUNNER_ARCH when neither is given).
    - name: Download dats
      id: download
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: dats
        version: ${{ inputs.version }}

    # dats sandboxes test commands by default (bubblewrap on Linux, seatbelt on
    # macOS, docker otherwise) -- real isolation, not a formality, so a caller
    # should never have to reach for --no-sandbox just to work around
    # infrastructure. Skips on non-Linux (macOS's seatbelt sandbox needs
    # neither of these steps).
    - name: Install bubblewrap (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: command -v bwrap >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y bubblewrap)

    # bwrap's unprivileged user namespace can be blocked two different ways,
    # and only one of them is fixable from here. Ubuntu 24.04's AppArmor
    # restriction (kernel.apparmor_restrict_unprivileged_userns) is a real
    # kernel sysctl a workflow step can clear -- confirmed on this repo's own
    # GitHub-hosted CI runner. The org's self-hosted wow-linux fleet has
    # neither that sysctl nor the older kernel.unprivileged_userns_clone
    # (confirmed via a live run: both report "no such file"), yet bwrap still
    # refuses -- there the job runs in an unprivileged container whose seccomp
    # profile denies unshare(CLONE_NEWUSER), and no workflow step can lift a
    # seccomp filter the container was started with. (NOT a capability: the
    # job container's CapEff is Docker's normal set with nothing dropped, and
    # unprivileged userns deliberately needs no CAP_SYS_ADMIN. Isolated on the
    # host by A/B run -- same image, same command, seccomp the only variable:
    # default profile EPERMs, seccomp=unconfined succeeds. Fixing it would mean
    # unfiltering every syscall for a container running arbitrary CI payloads,
    # a worse trade than falling through to docker.) So: try the sysctl fix
    # where a sysctl exists,
    # then fall through to dats' own docker backend (bwrap -> seatbelt ->
    # docker is dats' own auto order) when docker is usable. Only fail when
    # NEITHER works -- a caller whose job silently fell back to --no-sandbox
    # would trade real isolation for green CI, and this is the one place that
    # catches it before dats ever runs.
    - name: Make sure a real sandbox backend is usable (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-pid --die-with-parent true; then
          echo "bwrap works, no further action needed"
          exit 0
        fi

        echo "bwrap blocked; trying known kernel-level fixes"
        for knob in kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone; do
          path="/proc/sys/${knob//./\/}"
          if [ -f "$path" ]; then
            echo "$knob = $(cat "$path")"
            sudo sysctl -w "$knob=0" || true
          else
            echo "$knob: not present on this kernel"
          fi
        done

        if bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-pid --die-with-parent true; then
          echo "bwrap works after clearing the restriction"
          exit 0
        fi

        echo "bwrap still blocked -- likely the runner's own container lacks the capability, not a kernel sysctl"
        if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
          echo "docker is available; dats will fall back to it automatically"
          exit 0
        fi

        echo "::error::No usable sandbox backend on this runner: bwrap is blocked and docker is unavailable. Use a runner with a docker daemon (e.g. CI_RUNNER_DIND) instead."
        exit 1

    - name: Run dats
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        "${{ steps.download.outputs.path }}" ${{ inputs.args }}
