name: Run dats
description: Download the dats binary from buildhost and run it, without a caller having to hand-roll the download

inputs:
  args:
    description: 'Arguments to pass to dats (e.g. "test tests/", "--no-sandbox test tests/")'
    required: true
  working-directory:
    description: 'Directory to run dats from'
    required: false
    default: '.'
  version:
    description: 'dats release version to download (e.g. v3); omit for the newest on the default branch'
    required: false
    default: ''

outputs:
  path:
    description: 'Full path to the downloaded dats binary'
    value: ${{ steps.download.outputs.path }}

runs:
  using: composite
  steps:
    # os/arch default to the runner's own platform (buildhost-download reads
    # RUNNER_OS/RUNNER_ARCH when neither is given).
    - name: Download dats
      id: download
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: dats
        version: ${{ inputs.version }}

    # dats sandboxes test commands by default (bubblewrap on Linux, seatbelt on
    # macOS, docker otherwise) -- real isolation, not a formality, so a caller
    # should never have to reach for --no-sandbox just to work around
    # infrastructure. Skips on non-Linux (macOS's seatbelt sandbox needs
    # neither of these steps).
    - name: Install bubblewrap (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: command -v bwrap >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y bubblewrap)

    # Two distinct kernel knobs deny bwrap's unprivileged user namespace, and
    # which one (if either) applies depends on the runner: Ubuntu 24.04's
    # AppArmor restriction (kernel.apparmor_restrict_unprivileged_userns) is
    # what this repo's own GitHub-hosted CI runner has, but the org's
    # self-hosted fleet has neither sysctl file at all (confirmed via a live
    # run: `cannot stat .../apparmor_restrict_unprivileged_userns: No such
    # file or directory`) and still blocks bwrap -- so the older Debian-style
    # kernel.unprivileged_userns_clone must be the one actually in force
    # there. Clear whichever knob actually exists rather than assuming one.
    # The final bwrap check has no fallback -- a runner where neither knob
    # exists and bwrap still fails should fail loudly here, not silently ship
    # unsandboxed test runs.
    - name: Configure bubblewrap so it actually works (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-pid --die-with-parent true; then
          echo "bwrap already works, no sysctl change needed"
          exit 0
        fi

        echo "bwrap blocked; diagnosing before attempting a fix"
        uname -a
        for knob in kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone; do
          path="/proc/sys/${knob//./\/}"
          if [ -f "$path" ]; then
            echo "$knob = $(cat "$path")"
            sudo sysctl -w "$knob=0" || true
          else
            echo "$knob: not present on this kernel"
          fi
        done

        bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-pid --die-with-parent true

    - name: Run dats
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        "${{ steps.download.outputs.path }}" ${{ inputs.args }}
