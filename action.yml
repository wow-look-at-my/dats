name: Run dats
description: Download the dats binary from buildhost and run it, without a caller having to hand-roll the download

inputs:
  tests:
    description: 'Space- or newline-separated .dats files and directories to run. A directory runs its top-level *.dats files. Paths are relative to working-directory.'
    required: true
  working-directory:
    description: 'Directory to run dats from'
    required: false
    default: '.'
  version:
    description: 'dats release version to download (e.g. v3); omit for the newest on the default branch'
    required: false
    default: ''
  jobs:
    description: 'Commands to run at once, as -j takes it. "1" runs one at a time, which a stateful suite needs. Omit for one per CPU.'
    required: false
    default: ''
  sandbox:
    description: 'Sandbox backend: auto, bwrap, seatbelt, docker, or none. "none" is for a suite that drives the host itself, and it skips the backend install below.'
    required: false
    default: ''

outputs:
  path:
    description: 'Full path to the downloaded dats binary'
    value: ${{ steps.download.outputs.path }}

runs:
  using: composite
  steps:
    # os/arch default to the runner's own platform -- docs/action.md.
    - name: Download dats
      id: download
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: dats
        version: ${{ inputs.version }}

    # A caller must never need --no-sandbox to work around us -- docs/action.md.
    # A run that opted out needs no backend, and on NT this step builds a WSL one.
    - name: Install the sandbox backend
      if: inputs.sandbox != 'none'
      shell: bash
      env:
        # An NT runner hands out a backslash path, and bash eats each backslash as an escape -- docs/action.md.
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${ACTION_PATH//\\//}/.github/scripts/install-sandbox-backend.sh"

    # Clears what a step can clear, and deliberately does NOT judge the result -- docs/action.md.
    - name: Allow an unprivileged user namespace where the kernel gates one (Linux)
      if: runner.os == 'Linux' && inputs.sandbox != 'none'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${ACTION_PATH//\\//}/.github/scripts/allow-unprivileged-userns.sh"

    # run-dats.ts builds and sanitizes the argv, and starts the APE the way this host needs -- docs/action.md.
    - name: Run dats
      uses: wow-look-at-my/actions@typescript#latest
      with:
        file: ${{ github.action_path }}/.github/scripts/run-dats.ts
        inputs: ${{ toJSON(inputs) }}
      env:
        # The downloaded binary's path, passed via env so an NT backslash path arrives intact -- docs/action.md.
        DATS_BIN: ${{ steps.download.outputs.path }}
        DATS_ACTION_PATH: ${{ github.action_path }}
