name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      # The sandbox integration tests skip themselves when no backend is
      # usable, so without bubblewrap installed CI would report green while
      # testing none of the isolation. (The docker-backend tests use the
      # runner's own daemon, which is always present.)
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: true
          upload-artifacts: true

  schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/json-validator@master
        with:
          schema: schema.json
          files: testdata/schema/*.json
