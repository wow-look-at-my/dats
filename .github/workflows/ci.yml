name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      # Publishing records what buildhost stored on the org's linked
      # artifacts page and registers a GitHub Deployment for the release;
      # without these the publish step fails (HTTP 404 / "Resource not
      # accessible by integration"). Job-level permissions REPLACE
      # workflow-level ones, so they belong here alongside the rest.
      artifact-metadata: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
      # The sandbox integration tests skip themselves when no backend is
      # usable, so this step is what makes them mean something here: the
      # docker backend uses the runner's own daemon, while bubblewrap has to
      # be installed AND allowed a user namespace -- ubuntu-24.04 denies that
      # by default, which silently turned every bwrap test into a skip. The
      # probe below is the gate: an unusable bwrap fails the build with its
      # own error, before a single test runs.
      - run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Logged before it is cleared: this records, per run, whether the
          # restriction was actually in force -- the reason the next line
          # exists at all. A kernel without the knob prints nothing.
          echo "apparmor_restrict_unprivileged_userns before: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo '<absent>')"
          bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-pid --die-with-parent true \
            && echo "bwrap works without clearing the restriction" \
            || echo "bwrap blocked with the restriction in force (see error above)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-pid --die-with-parent true
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: true
          upload-artifacts: true

  schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/json-validator@master
        with:
          schema: schema.json
          files: testdata/schema/*.json

  # Consumers reference this repo's own action.yml (wow-look-at-my/dats@master)
  # to get real sandboxing on the org's self-hosted fleet -- a class of runner
  # this repo's other jobs never touch (they're all ubuntu-latest). This uses
  # the dind pool the way a real consumer does; the container is privileged, so
  # dats' bwrap -> seatbelt -> docker order lands on bwrap. Catches a
  # regression in either the action or a backend before a consumer's CI does.
  self-hosted-sandbox:
    runs-on: ${{ vars.CI_RUNNER_DIND || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          args: test examples/sandbox.dats

  # The UNPRIVILEGED half, and the one that would have caught #41.
  #
  # The slim wow-linux pool runs an unprivileged container: no CAP_SYS_ADMIN.
  # Creating a PID or mount namespace DIRECTLY needs that capability, so for a
  # long time the belief here was that "bwrap cannot work at all" on this pool.
  # That was wrong in a specific way: a namespace created INSIDE a user
  # namespace needs no capability, and dats simply was not passing
  # --unshare-user. Measured inside a wow-linux job container that HAD the
  # seccomp relaxation described below: `unshare --user` exits 0, `unshare
  # --pid` and `--mount` each fail EPERM, and a tmpfs mount inside a user
  # namespace succeeds.
  #
  # TWO things are needed and only one is in this repo:
  #   1. dats passes --unshare-user (this branch), and
  #   2. the runner container is ALLOWED to create a user namespace at all.
  #
  # (2) is the fleet's business: the slim image's hook opts in via
  # webhooks#242's `seccomp: { userns: true }`, which passes docker's default
  # profile plus an ungated allow for unshare/clone/clone3/setns. Until that
  # merges AND the fleet redeploys, this job fails at `bwrap: No permissions to
  # create new namespace` -- correctly, since the runner genuinely cannot do it
  # yet.
  #
  # So it is continue-on-error FOR NOW: the job still runs and still reports,
  # but a fleet that has not caught up does not block an unrelated merge.
  # Remove the flag once the redeploy lands -- at that point a failure here
  # means dats regressed, which is the whole reason the job exists. Running the
  # same suite on both pools is what keeps the fix honest: if --unshare-user is
  # ever dropped, this fails while the dind job above stays green, the exact
  # asymmetry that hid the bug for months.
  self-hosted-sandbox-unprivileged:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          args: test examples/sandbox.dats
