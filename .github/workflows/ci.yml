name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      # Publishing needs both -- README.md "test: artifact-metadata and deployments".
      artifact-metadata: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
      # Without this the bwrap tests SKIP -- README.md "test: installing bubblewrap and clearing the restriction".
      - run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Logged before it is cleared, so each run records whether it was in force.
          echo "apparmor_restrict_unprivileged_userns before: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo '<absent>')"
          bwrap --ro-bind / / --unshare-user --unshare-pid --dev /dev --proc /proc --tmpfs /tmp --die-with-parent true \
            && echo "bwrap works without clearing the restriction" \
            || echo "bwrap blocked with the restriction in force (see error above)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-user --unshare-pid --dev /dev --proc /proc --tmpfs /tmp --die-with-parent true
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: true
          upload-artifacts: true

  schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/json-validator@master
        with:
          schema: schema.json
          files: testdata/schema/*.json

  # This repo's own action, on the fleet a consumer uses -- README.md "self-hosted-sandbox".
  self-hosted-sandbox:
    runs-on: ${{ vars.CI_RUNNER_DIND || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          args: test examples/sandbox.dats

  # A sandbox exercised only under privilege is not exercised -- README.md "self-hosted-sandbox-unprivileged".
  self-hosted-sandbox-unprivileged:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # Installs bwrap and clears the sysctls, then hands back the binary it downloaded.
      - uses: ./
        id: dats
        with:
          args: --version
      # Asserts what dats owes in whichever state the fleet is in -- the script's own header.
      - run: .github/scripts/fleet-sandbox.sh "${{ steps.dats.outputs.path }}" examples/sandbox.dats
