name: CI

on:
  push:
    # Every branch and no tag: a bare push: re-enters this workflow on each tag the release step pushes.
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      # Publishing needs both.
      artifact-metadata: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
      # Without this the bwrap tests SKIP.
      - run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Logged before it is cleared, so each run records whether it was in force.
          echo "apparmor_restrict_unprivileged_userns before: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo '<absent>')"
          bwrap --ro-bind / / --unshare-user --unshare-pid --dev /dev --proc /proc --tmpfs /tmp --die-with-parent true \
            && echo "bwrap works without clearing the restriction" \
            || echo "bwrap blocked with the restriction in force (see error above)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-user --unshare-pid --dev /dev --proc /proc --tmpfs /tmp --die-with-parent true
      # Its own step, so an unusable loopback sshd fails here rather than skipping every ssh test.
      - run: |
          sudo apt-get install -y openssh-server
          sudo systemctl start ssh || sudo service ssh start
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          # BatchMode refuses an unknown host key rather than prompting.
          ssh-keyscan -H localhost 127.0.0.1 >> ~/.ssh/known_hosts
          # Two target STRINGS for one machine: the per-test override needs a second.
          for t in localhost 127.0.0.1; do
            ssh -o BatchMode=yes -o ConnectTimeout=5 "$t" 'echo ssh ok; command -v tar bash'
          done
      - uses: wow-look-at-my/go-toolchain@master
        env:
          # Job level, not step level: the tests run inside the action.
          DATS_TEST_SSH_TARGET: localhost
          DATS_TEST_SSH_TARGET2: 127.0.0.1
        with:
          autorelease: true

  schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/json-validator@master
        with:
          schema: schema.json
          files: testdata/schema/*.json

  # This repo's own action, on the fleet a consumer uses.
  self-hosted-sandbox:
    runs-on: ${{ vars.CI_RUNNER_DIND || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          tests: examples/sandbox.dats

  # The ACTION on every host a consumer runs it on. Starting the published APE differs per host, and only this job reads that -- CLAUDE.md.
  action-every-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          tests: examples/example.dats

  # The action's two selecting inputs. Its own job, and never after a sandboxed
  # one: sandbox: none skips the backend install, and a job that already
  # installed a backend cannot show that the skip is harmless.
  action-opted-out:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          tests: examples/example.dats
          jobs: '1'
          sandbox: none

  # One script on three hosts: the NT leg gates runner/hostpath.go, the posix legs make a red one a difference -- CLAUDE.md.
  every-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # THIS commit's binary: the APE the test job handed off runs on all three hosts.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-test.broot
          path: build
      # The .exe name everywhere: NT needs the suffix and a posix host does not care, so one script covers every leg.
      - name: Run this commit's binary
        shell: bash
        run: |
          set -euo pipefail
          cp build/dats build/dats.exe
          chmod +x build/dats.exe
          ./build/dats.exe --version
          ./build/dats.exe --no-sandbox test examples/example.dats

  # The two native backends, on THIS commit's binary -- action-every-host runs the published one, see CLAUDE.md.
  native-backends:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-test.broot
          path: build
      # The same script the action installs a backend with, so a consumer's host and this one agree.
      - name: Provision the sandbox backend
        shell: bash
        run: bash .github/scripts/install-sandbox-backend.sh
      # Same pair of scripts, in the same order, as action.yml: a kernel that gates the user namespace denies bwrap one.
      - name: Allow an unprivileged user namespace where the kernel gates one (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/allow-unprivileged-userns.sh
      # No --no-sandbox: what this job exists to run is the sandboxed path.
      - name: The backends agree about what a command may write
        shell: bash
        run: |
          set -euo pipefail
          cp build/dats build/dats.exe
          chmod +x build/dats.exe
          ./build/dats.exe -v test examples/sandbox.dats

  # A sandbox exercised only under privilege is not exercised.
  sandbox-unprivileged-masked:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # THIS commit's binary, not the published one.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-test.broot
          path: build
      - name: Stage the binary this commit built
        run: |
          if [ -f build/dats_linux_amd64 ]; then install -m 0755 build/dats_linux_amd64 build/dats; fi
          chmod +x build/dats
          ./build/dats --version
      # An unprivileged container shaped like the fleet's.
      - name: Run the suite in an unprivileged container whose /proc is masked
        run: .github/scripts/masked-container-sandbox.sh
