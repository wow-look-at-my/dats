name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      # actions/checks read: the org no-all-builds-job guard (the first step
      # inside wow-look-at-my/go-toolchain@v1) scans the run's jobs and the head
      # commit's check runs since no-all-builds-job#3 (2026-07-20), and FAILS
      # CLOSED when it cannot scan ("Resource not accessible by integration").
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: true
          upload-artifacts: true

  schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/json-validator@master
        with:
          schema: schema.json
          files: testdata/schema/*.json
